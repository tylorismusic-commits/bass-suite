name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libcairo2-dev libfreetype6-dev libx11-dev \
            lv2-dev liblilv-dev libsamplerate0-dev libxtst-dev xvfb

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: lv2lint
        if: matrix.compiler == 'g++'
        run: |
          sudo apt-get install -y lv2lint || true
          if command -v lv2lint >/dev/null 2>&1; then
            LV2_PATH="$PWD/build/lv2" lv2lint -S bass_suite \
              https://github.com/tylorismusic-commits/bass-suite
          else
            echo "lv2lint not packaged here; skipped"
          fi
